<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest View — Aarambham Live Entry Monitor</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light text-dark">

    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-warning fs-4" href="#">
                <i class="bi bi-flower1 text-warning me-2"></i>Aarambham Onam Live Entry View
            </a>
            <div class="d-flex gap-2">
                <a href="/scanner" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="bi bi-camera me-1"></i> Open Scanner
                </a>
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">

        <!-- Dashboard Stats Cards -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm rounded-4 bg-primary text-white p-3">
                    <div class="d-flex align-items-center">
                        <div class="fs-1 me-3 opacity-75"><i class="bi bi-people-fill"></i></div>
                        <div>
                            <div class="text-uppercase small fw-semibold opacity-75">Registered Students</div>
                            <div id="statRegistered" class="display-6 fw-bold">0</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm rounded-4 bg-success text-white p-3">
                    <div class="d-flex align-items-center">
                        <div class="fs-1 me-3 opacity-75"><i class="bi bi-door-open-fill"></i></div>
                        <div>
                            <div class="text-uppercase small fw-semibold opacity-75">Currently Inside</div>
                            <div id="statInside" class="display-6 fw-bold">0</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm rounded-4 bg-info text-white p-3">
                    <div class="d-flex align-items-center">
                        <div class="fs-1 me-3 opacity-75"><i class="bi bi-box-arrow-right"></i></div>
                        <div>
                            <div class="text-uppercase small fw-semibold opacity-75">Exited Event</div>
                            <div id="statExited" class="display-6 fw-bold">0</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm rounded-4 bg-warning text-dark p-3">
                    <div class="d-flex align-items-center">
                        <div class="fs-1 me-3 opacity-75"><i class="bi bi-clock-history"></i></div>
                        <div>
                            <div class="text-uppercase small fw-semibold opacity-75">Not Entered</div>
                            <div id="statNotEntered" class="display-6 fw-bold">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toolbar & Search -->
        <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-3">
                <div class="row g-3 align-items-center justify-content-between">
                    <!-- Search Input -->
                    <div class="col-12 col-md-6">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchInput" class="form-control border-start-0 ps-0" placeholder="Search entered students by Roll Number or Name...">
                        </div>
                    </div>
                    
                    <!-- Refresh Info -->
                    <div class="col-12 col-md-6 d-flex align-items-center justify-content-md-end gap-2 text-muted small">
                        <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3 py-2">
                            <i class="bi bi-broadcast me-1"></i> Live Auto-Updating
                        </span>
                        <button id="refreshBtn" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                            <i class="bi bi-arrow-clockwise me-1"></i> Refresh
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <!-- Student Data Table Card -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-header bg-white py-3 px-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
                <h5 class="mb-0 fw-bold text-secondary"><i class="bi bi-card-checklist me-2 text-primary"></i>Aarambham Attendance Log</h5>
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <div class="btn-group btn-group-sm" id="guestFilterGroup" role="group" aria-label="Status Filter">
                        <button type="button" class="btn btn-dark active" data-filter="all">All</button>
                        <button type="button" class="btn btn-outline-success" data-filter="inside">Inside</button>
                        <button type="button" class="btn btn-outline-info" data-filter="exited">Exited</button>
                        <button type="button" class="btn btn-outline-warning" data-filter="not_entered">Not Entered</button>
                    </div>
                    <span id="studentCountBadge" class="badge bg-secondary rounded-pill">0 Students</span>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">#</th>
                            <th>Roll Number</th>
                            <th>Student Name</th>
                            <th>Entry Time</th>
                            <th>Exit Time</th>
                            <th class="text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="guestStudentsBody">
                        <tr>
                            <td colspan="6" class="text-center py-5 text-muted">
                                <div class="spinner-border spinner-border-sm me-2" role="status"></div> Loading live entry data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentFilter = 'all';

            loadGuestStats();
            loadEnteredStudents('', currentFilter);

            // Auto-refresh stats and student list every 5 seconds
            setInterval(() => {
                loadGuestStats();
                loadEnteredStudents(document.getElementById('searchInput').value, currentFilter);
            }, 5000);

            document.querySelectorAll('#guestFilterGroup button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('#guestFilterGroup button').forEach(b => {
                        b.className = `btn btn-outline-secondary btn-sm`;
                    });
                    const target = e.target;
                    target.className = `btn btn-dark btn-sm active`;
                    currentFilter = target.dataset.filter;
                    loadEnteredStudents(document.getElementById('searchInput').value, currentFilter);
                });
            });

            const searchInput = document.getElementById('searchInput');
            let searchTimeout = null;
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    loadEnteredStudents(searchInput.value, currentFilter);
                }, 300);
            });

            document.getElementById('refreshBtn').addEventListener('click', () => {
                loadGuestStats();
                loadEnteredStudents(searchInput.value, currentFilter);
            });

            document.getElementById('logoutBtn').addEventListener('click', async () => {
                try {
                    await fetch('/api/logout', { method: 'POST' });
                } catch(e){}
                window.location.href = '/login';
            });
        });

        async function loadGuestStats() {
            try {
                const res = await fetch('/api/guest/stats');
                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                const stats = await res.json();
                document.getElementById('statRegistered').textContent = (stats.registered || 0).toLocaleString();
                document.getElementById('statInside').textContent = (stats.inside || 0).toLocaleString();
                document.getElementById('statExited').textContent = (stats.exited || 0).toLocaleString();
                document.getElementById('statNotEntered').textContent = (stats.not_entered || 0).toLocaleString();
            } catch (e) {
                console.error("Failed to load guest stats", e);
            }
        }

        async function loadEnteredStudents(query = '', statusFilter = 'all') {
            const tbody = document.getElementById('guestStudentsBody');
            try {
                let url = `/api/guest/students?status_filter=${statusFilter}`;
                if (query) url += `&search=${encodeURIComponent(query)}`;

                const res = await fetch(url);
                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                const students = await res.json();

                document.getElementById('studentCountBadge').textContent = `${students.length} Students`;

                if (students.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6" class="text-center py-4 text-muted">
                                No student records found matching filter.
                            </td>
                        </tr>`;
                    return;
                }

                tbody.innerHTML = students.map((s, idx) => {
                    let statusBadge = '';
                    if (s.status === 'INSIDE') {
                        statusBadge = '<span class="badge bg-success text-white rounded-pill px-3"><i class="bi bi-door-open-fill me-1"></i> INSIDE</span>';
                    } else if (s.status === 'EXITED') {
                        statusBadge = '<span class="badge bg-info text-white rounded-pill px-3"><i class="bi bi-box-arrow-right me-1"></i> EXITED</span>';
                    } else {
                        statusBadge = '<span class="badge bg-secondary text-white rounded-pill px-3"><i class="bi bi-dash-circle me-1"></i> NOT ENTERED</span>';
                    }

                    return `
                        <tr>
                            <td class="ps-4 text-muted small">${idx + 1}</td>
                            <td class="fw-bold font-monospace text-primary">${s.roll_number}</td>
                            <td class="fw-semibold">${s.name}</td>
                            <td class="small text-muted">${s.entry_time || '—'}</td>
                            <td class="small text-muted">${s.exit_time || '—'}</td>
                            <td class="text-center">${statusBadge}</td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center py-4 text-danger">Failed to load attendance log.</td>
                    </tr>`;
            }
        }
    </script>
</body>
</html>
